name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint · migrate · test · eval)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: copilot
          POSTGRES_DB: copilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U copilot -d copilot"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://copilot:copilot@localhost:5432/copilot
      TEST_DATABASE_URL: postgresql+psycopg://copilot:copilot@localhost:5432/copilot_test
      REDIS_URL: redis://localhost:6379/0
      LLM_PROVIDER: fake
      TOOLS_PROVIDER: fake
      EMBEDDING_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Prepare databases (pgvector)
        env:
          PGPASSWORD: copilot
        run: |
          psql -h localhost -U copilot -d copilot -c "CREATE EXTENSION IF NOT EXISTS vector;"
          psql -h localhost -U copilot -d copilot -c "CREATE DATABASE copilot_test;"
          psql -h localhost -U copilot -d copilot_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Migrations apply cleanly
        run: alembic upgrade head

      - name: Test (unit + integration)
        run: python -m pytest -q

      - name: Evaluation harness (quality + grounding gate)
        run: python -m app.eval

  frontend:
    name: Frontend (lint · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Test (vitest)
        run: npm test

      - name: Build (production)
        run: npm run build
