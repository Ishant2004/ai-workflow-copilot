name: Deploy (ECR + ECS Fargate)

# Builds images, pushes to ECR, migrates the DB, then rolls the ECS services.
# Inert until you opt in: set repo variable DEPLOY_ENABLED=true and provide the
# AWS_* variables/secrets below (see docs/deployment.md). Nothing is hardcoded.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # OIDC federation to assume the AWS deploy role

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-push:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      backend_image: ${{ steps.img.outputs.backend }}
      frontend_image: ${{ steps.img.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image URIs
        id: img
        run: |
          REG="${{ steps.ecr.outputs.registry }}"
          echo "backend=$REG/${{ vars.ECR_BACKEND_REPO }}:${IMAGE_TAG}"  >> "$GITHUB_OUTPUT"
          echo "frontend=$REG/${{ vars.ECR_FRONTEND_REPO }}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build & push backend (prod target)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: prod
          push: true
          tags: ${{ steps.img.outputs.backend }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.img.outputs.frontend }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.FRONTEND_API_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    needs: build-push
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Render migration task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: deploy/ecs/task-def.migrate.json
          container-name: migrate
          image: ${{ needs.build-push.outputs.backend_image }}

      - name: Register + run one-off migration task, wait, and check exit code
        run: |
          set -euo pipefail
          TD_ARN=$(aws ecs register-task-definition \
            --cli-input-json "file://${{ steps.render.outputs.task-definition }}" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          TASK_ARN=$(aws ecs run-task \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --task-definition "$TD_ARN" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ vars.ECS_SUBNETS }}],securityGroups=[${{ vars.ECS_SECURITY_GROUP }}],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' --output text)
          echo "Migration task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster "${{ vars.ECS_CLUSTER }}" --tasks "$TASK_ARN"
          CODE=$(aws ecs describe-tasks --cluster "${{ vars.ECS_CLUSTER }}" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          echo "Migration exit code: $CODE"
          test "$CODE" = "0"

  deploy:
    needs: [build-push, migrate]
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { taskdef: deploy/ecs/task-def.api.json,      container: api,      service_var: ECS_SERVICE_API,      image_kind: backend }
          - { taskdef: deploy/ecs/task-def.worker.json,   container: worker,   service_var: ECS_SERVICE_WORKER,   image_kind: backend }
          - { taskdef: deploy/ecs/task-def.beat.json,     container: beat,     service_var: ECS_SERVICE_BEAT,     image_kind: backend }
          - { taskdef: deploy/ecs/task-def.frontend.json, container: frontend, service_var: ECS_SERVICE_FRONTEND, image_kind: frontend }
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Select image for this service
        id: pick
        run: |
          if [ "${{ matrix.image_kind }}" = "backend" ]; then
            echo "image=${{ needs.build-push.outputs.backend_image }}" >> "$GITHUB_OUTPUT"
          else
            echo "image=${{ needs.build-push.outputs.frontend_image }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Render task definition (${{ matrix.container }})
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ matrix.taskdef }}
          container-name: ${{ matrix.container }}
          image: ${{ steps.pick.outputs.image }}

      - name: Deploy to ECS (${{ matrix.container }})
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars[matrix.service_var] }}
          wait-for-service-stability: true
