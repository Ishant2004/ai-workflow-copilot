# Production overlay.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Real secrets/config come from the environment (or an out-of-repo .env.production),
# never baked into the image. This file is a local/staging approximation of prod.
services:
  # One-off migration job — runs once and exits. Keeping migrations out of the
  # server entrypoint avoids races when the backend scales to multiple replicas.
  migrate:
    build:
      context: ./backend
      target: prod
    command: ["alembic", "upgrade", "head"]
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://copilot:copilot@postgres:5432/copilot
    env_file:
      - path: ./backend/.env.production
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      target: prod
    environment:
      APP_ENV: production
      LOG_LEVEL: INFO
      DEBUG: "false"
      UVICORN_WORKERS: "4"
    # Provide real values out-of-repo; keep this file secret-free.
    # Optional: prod normally injects real env vars via the platform instead.
    env_file:
      - path: ./backend/.env.production
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    restart: unless-stopped
    # No source bind-mount and no --reload in production (image is immutable).

  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped
