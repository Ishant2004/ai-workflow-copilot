# Render blueprint — FREE tier (no credit card).
# Setup: Render Dashboard → New → Blueprint → pick this repo → Apply. Render builds
# the Dockerfiles in its cloud (no local Docker needed).
#
# This variant runs on Render's free plans only: web API + web frontend + free
# Postgres. Workflow runs execute INLINE (RUN_ASYNC=false), so there's no Celery
# worker/Redis to pay for. Trade-off: no background queue and no cron scheduling.
# To enable those later, uncomment the Redis + worker blocks at the bottom, add
# REDIS_URL back to the API, and set RUN_ASYNC=true (the worker needs a paid plan).
#
# After the first deploy: set ANTHROPIC_API_KEY (secret) on copilot-api, and if the
# assigned URLs differ from the defaults, update NEXT_PUBLIC_API_BASE_URL (frontend)
# and CORS_ORIGINS (api), then redeploy. See docs/deployment.md.

databases:
  - name: copilot-db
    databaseName: copilot
    user: copilot
    plan: free # free Postgres, no card (expires after 90 days)
    postgresMajorVersion: "16" # pgvector is enabled by the app's first migration
    region: singapore

services:
  # --- API (FastAPI) ---
  - type: web
    name: copilot-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: free # free web instances cold-start after ~15 min idle
    healthCheckPath: /health/ready
    # Applies migrations, then starts uvicorn on Render's $PORT (see the script).
    dockerCommand: sh scripts/render-start.sh
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: RUN_ASYNC
        value: "false" # execute runs inline (no Celery worker needed)
      - key: UVICORN_WORKERS
        value: "2"
      - key: LLM_PROVIDER
        value: anthropic # set to "fake" to run without an API key
      - key: TOOLS_PROVIDER
        value: live
      - key: EMBEDDING_PROVIDER
        value: fake
      - key: ANTHROPIC_API_KEY
        sync: false # set this secret in the Render dashboard
      - key: CORS_ORIGINS
        value: https://copilot-frontend.onrender.com # ← update to the real frontend URL
      - key: DATABASE_URL
        fromDatabase:
          name: copilot-db
          property: connectionString

  # --- Frontend (Next.js standalone) ---
  - type: web
    name: copilot-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    region: singapore
    plan: free
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Next standalone server.js binds $HOSTNAME; force 0.0.0.0 so Render can reach it
      # (the container's default HOSTNAME is an unbindable container id).
      - key: HOSTNAME
        value: 0.0.0.0
      # Browser-facing, baked at build. Must be the API's public URL.
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://copilot-api.onrender.com # ← update to the real API URL

# ─────────────────────────────────────────────────────────────────────────────
